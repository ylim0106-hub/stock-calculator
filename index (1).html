<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>均摊成本计算器</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f4f4f0;
    --surface: #ffffff;
    --surface2: #f0f0ec;
    --border: #e2e2da;
    --text: #1a1a1a;
    --muted: #9a9a90;
    --accent: #1a7a4a;
    --accent-light: #eaf5f0;
    --red: #c0392b;
    --red-light: #fdf0ee;
    --blue: #2563eb;
    --blue-light: #eff6ff;
    --purple: #7c3aed;
    --purple-light: #f5f3ff;
    --yellow: #b45309;
    --yellow-light: #fffbeb;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }

  .logo { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 3px; }
  .logo em { color: var(--accent); font-style: normal; }
  .logo-sub { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 2px; margin-bottom: 22px; }

  .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 14px; }

  .sec-title { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .sec-title::before { content:''; width:3px; height:13px; background:var(--accent); border-radius:2px; display:inline-block; }

  /* Ticker */
  .ticker-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .ticker-tabs { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .ticker-tab {
    font-family: var(--mono); font-size: 12px; font-weight: 700;
    padding: 6px 14px; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--muted); cursor: pointer; transition: 0.15s; position: relative;
  }
  .ticker-tab:hover { border-color: var(--accent); color: var(--text); }
  .ticker-tab.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .ticker-tab .tab-price { font-size: 10px; display: block; margin-top: 1px; }
  .ticker-tab .tab-x {
    position: absolute; top: -7px; right: -7px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--red); color: #fff; font-size: 9px;
    display: none; align-items: center; justify-content: center; border: none; cursor: pointer;
  }
  .ticker-tab:hover .tab-x { display: flex; }
  .add-wrap { display: flex; gap: 8px; }
  .add-in {
    font-family: var(--mono); font-size: 13px; font-weight: 700; text-transform: uppercase;
    background: var(--surface2); border: 1.5px solid var(--border); color: var(--text);
    padding: 7px 12px; border-radius: 8px; width: 90px; outline: none;
  }
  .add-in:focus { border-color: var(--accent); background: #fff; }
  .btn-add { background: var(--accent); color: #fff; border: none; font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  .btn-add:hover { filter: brightness(1.1); }

  /* Price */
  .price-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .live-price { font-family: var(--mono); font-size: 42px; font-weight: 700; color: var(--accent); line-height: 1; }
  .live-price.down { color: var(--red); }
  .price-chg { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--accent-light); color: var(--accent); }
  .price-chg.neg { background: var(--red-light); color: var(--red); }
  .btn-refresh { background: var(--surface2); border: 1.5px solid var(--border); color: var(--accent); font-family: var(--mono); font-size: 11px; padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .btn-refresh:hover { border-color: var(--accent); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .price-meta { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; animation: pulse 2s infinite; }
  .dot.live { background: var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
  .price-status { font-family: var(--mono); font-size: 10px; color: var(--muted); }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-box { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat-lbl { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .stat-val { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text); }
  .stat-val.g { color: var(--accent); }
  .stat-val.r { color: var(--red); }
  .stat-val.b { color: var(--blue); }
  .stat-val.p { color: var(--purple); }

  /* Progress */
  .prog-wrap { margin-top: 4px; }
  .prog-hd { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  .prog-track { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
  .prog-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), #22d3ee); transition: width 0.5s; }

  /* Cost to zero */
  .cost-to-zero { background: var(--yellow-light); border: 1.5px solid rgba(180,83,9,0.2); border-radius: 10px; padding: 12px 16px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
  .ctz-label { font-family: var(--mono); font-size: 10px; color: var(--yellow); letter-spacing: 1px; text-transform: uppercase; }
  .ctz-val { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--yellow); }
  .ctz-val.zero { color: var(--accent); }

  /* Alert */
  .alert { font-family: var(--mono); font-size: 11px; padding: 10px 14px; border-radius: 9px; margin-top: 12px; }
  .alert.ok { background: var(--accent-light); color: var(--accent); border: 1.5px solid rgba(26,122,74,0.2); }
  .alert.bad { background: var(--red-light); color: var(--red); border: 1.5px solid rgba(192,57,43,0.2); }

  /* Form */
  .tx-form { display: grid; grid-template-columns: 120px 1fr 1fr 1fr auto; gap: 10px; align-items: end; }
  .tx-form.div-mode { grid-template-columns: 120px 1fr 1fr auto; }
  @media(max-width:600px){ .tx-form, .tx-form.div-mode { grid-template-columns:1fr 1fr; } .btn-confirm{grid-column:1/-1;} }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  input[type=number], select {
    background: var(--surface2); border: 1.5px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 13px; padding: 9px 11px; border-radius: 9px; outline: none; width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); background: #fff; }
  select option { background: #fff; }
  .btn-confirm { background: var(--accent); color: #fff; border: none; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 10px 20px; border-radius: 9px; cursor: pointer; white-space: nowrap; align-self: end; }
  .btn-confirm:hover { filter: brightness(1.1); }
  .btn-confirm.sell { background: var(--red); }
  .btn-confirm.div { background: var(--purple); }
  .fee-hint { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 8px; min-height: 15px; }

  /* Dynamic form fields */
  .field.hidden { display: none; }

  /* Tx list */
  .list-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .btn-clear { background: none; border: 1.5px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 10px; padding: 5px 12px; border-radius: 7px; cursor: pointer; }
  .btn-clear:hover { color: var(--red); border-color: var(--red); }
  .tx-list { display: flex; flex-direction: column; gap: 7px; }
  .tx-item {
    display: grid; grid-template-columns: auto 1fr auto auto auto;
    align-items: center; gap: 10px; padding: 11px 14px;
    background: var(--surface2); border: 1.5px solid var(--border); border-radius: 10px;
    font-family: var(--mono); font-size: 12px; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)} }
  .badge { padding: 2px 9px; border-radius: 5px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
  .badge.buy { background: var(--accent-light); color: var(--accent); }
  .badge.sell { background: var(--red-light); color: var(--red); }
  .badge.div { background: var(--purple-light); color: var(--purple); }
  .tx-info { color: var(--muted); }
  .tx-info strong { color: var(--text); }
  .tx-fee-lbl { color: var(--red); font-size: 11px; }
  .tx-eff { font-size: 11px; font-weight: 700; }
  .tx-eff.g { color: var(--accent); }
  .tx-eff.r { color: var(--red); }
  .tx-eff.p { color: var(--purple); }
  .tx-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 4px; }
  .tx-del:hover { color: var(--red); background: var(--red-light); }
  .empty { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; padding: 28px; border: 1.5px dashed var(--border); border-radius: 10px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">均摊成本 <em>·</em> 做T计算器</div>
  <div class="logo-sub">COST BASIS · T-TRADE · DIVIDEND TRACKER</div>

  <!-- Price Card -->
  <div class="card">
    <div class="ticker-row">
      <div class="ticker-tabs" id="tickerTabs"></div>
      <div class="add-wrap">
        <input class="add-in" id="newTicker" type="text" placeholder="TSLA" maxlength="8"/>
        <button class="btn-add" onclick="addTicker()">+ 添加</button>
      </div>
    </div>
    <div class="price-row">
      <div class="live-price" id="livePrice">---.--</div>
      <div class="price-chg" id="priceChg">-- %</div>
      <button class="btn-refresh" onclick="fetchPrice()"><span id="refreshIcon">⟳</span> 刷新</button>
    </div>
    <div class="price-meta">
      <span class="dot" id="liveDot"></span>
      <span class="price-status" id="priceStatus">未加载</span>
    </div>
  </div>

  <!-- Stats Card -->
  <div class="card">
    <div class="sec-title">持仓概览</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-lbl">平均成本</div>
        <div class="stat-val" id="sAvg">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">总股数</div>
        <div class="stat-val b" id="sShares">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">总成本（含费）</div>
        <div class="stat-val" id="sTotalCost">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">市值</div>
        <div class="stat-val" id="sMarket">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">未实现盈亏</div>
        <div class="stat-val" id="sPnl">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">总手续费</div>
        <div class="stat-val r" id="sFees">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">做T总盈利</div>
        <div class="stat-val g" id="sTProfit">$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">总派息收入</div>
        <div class="stat-val p" id="sDividend">$0.00</div>
      </div>
    </div>

    <div class="prog-wrap">
      <div class="prog-hd"><span>成本降低进度（做T + 派息）</span><span id="progPct">0%</span></div>
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>

    <div class="cost-to-zero" id="ctzRow" style="display:none">
      <span class="ctz-label">离零成本还差</span>
      <span class="ctz-val" id="ctzVal">--</span>
    </div>

    <div id="alertBox"></div>
  </div>

  <!-- Add Transaction -->
  <div class="card">
    <div class="sec-title">添加记录</div>
    <div class="tx-form" id="txForm">
      <div class="field">
        <label>类型</label>
        <select id="txType" onchange="onTypeChange()">
          <option value="buy">买入 BUY</option>
          <option value="sell">卖出 SELL</option>
          <option value="div">派息 DIVIDEND</option>
        </select>
      </div>
      <!-- Buy/Sell fields -->
      <div class="field" id="fShares">
        <label>股数</label>
        <input type="number" id="txShares" placeholder="100" min="0" step="1" oninput="updateHint()"/>
      </div>
      <div class="field" id="fPrice">
        <label>价格 / 股</label>
        <input type="number" id="txPrice" placeholder="67.39" min="0" step="0.001" oninput="updateHint()"/>
      </div>
      <div class="field" id="fFee">
        <label>手续费 ($)</label>
        <input type="number" id="txFee" placeholder="1.92" min="0" step="0.01" value="1.92" oninput="updateHint()"/>
      </div>
      <!-- Dividend fields -->
      <div class="field hidden" id="fDivTotal">
        <label>总派息金额 ($)</label>
        <input type="number" id="txDivTotal" placeholder="50.00" min="0" step="0.01" oninput="updateHint()"/>
      </div>
      <div class="field hidden" id="fDivPer">
        <label>每股派息 ($) 可选</label>
        <input type="number" id="txDivPer" placeholder="0.50" min="0" step="0.0001" oninput="calcDivTotal()"/>
      </div>
      <button class="btn-confirm" id="btnConfirm" onclick="addTx()">确认</button>
    </div>
    <div class="fee-hint" id="feeHint"></div>
  </div>

  <!-- Transaction List -->
  <div class="card">
    <div class="list-hd">
      <div class="sec-title" style="margin:0">交易记录</div>
      <button class="btn-clear" onclick="clearTx()">清空记录</button>
    </div>
    <div class="tx-list" id="txList">
      <div class="empty">还没有交易记录</div>
    </div>
  </div>

</div>
<script>
const FINNHUB_KEY = 'd7t81npr01qugn09nik0d7t81npr01qugn09nikg';
let tickers = [], active = null, positions = {}, refreshTimer = null;

// ── Storage ────────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('sc5_tickers', JSON.stringify(tickers.map(t => t.symbol)));
  localStorage.setItem('sc5_active', active || '');
  localStorage.setItem('sc5_positions', JSON.stringify(positions));
}
function load() {
  try {
    const syms = JSON.parse(localStorage.getItem('sc5_tickers') || '["TQQQ"]');
    tickers = syms.map(s => ({ symbol: s, price: null, chg: null, pct: null }));
    active = localStorage.getItem('sc5_active') || syms[0];
    positions = JSON.parse(localStorage.getItem('sc5_positions') || '{}');
    syms.forEach(s => { if (!positions[s]) positions[s] = { transactions: [] }; });
  } catch(e) {
    tickers = [{ symbol: 'TQQQ', price: null, chg: null, pct: null }];
    active = 'TQQQ';
    positions = { TQQQ: { transactions: [] } };
  }
}

// ── Tickers ────────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById('tickerTabs').innerHTML = tickers.map(t => `
    <div class="ticker-tab ${t.symbol===active?'active':''}" onclick="switchTicker('${t.symbol}')">
      ${t.symbol}
      <span class="tab-price">${t.price ? '$'+t.price.toFixed(2) : '---'}</span>
      <button class="tab-x" onclick="removeTicker(event,'${t.symbol}')">✕</button>
    </div>`).join('');
}
function switchTicker(sym) { active = sym; renderTabs(); updatePriceDisplay(); recalc(); save(); }
function addTicker() {
  const sym = document.getElementById('newTicker').value.trim().toUpperCase();
  if (!sym) return;
  if (tickers.find(t => t.symbol === sym)) { switchTicker(sym); document.getElementById('newTicker').value = ''; return; }
  tickers.push({ symbol: sym, price: null, chg: null, pct: null });
  if (!positions[sym]) positions[sym] = { transactions: [] };
  document.getElementById('newTicker').value = '';
  switchTicker(sym); fetchAllPrices();
}
function removeTicker(e, sym) {
  e.stopPropagation();
  if (tickers.length === 1) return alert('至少保留一个股票');
  if (!confirm(`删除 ${sym} 的所有记录？`)) return;
  tickers = tickers.filter(t => t.symbol !== sym); delete positions[sym];
  if (active === sym) active = tickers[0].symbol;
  renderTabs(); updatePriceDisplay(); recalc(); save();
}
document.getElementById('newTicker').addEventListener('keydown', e => { if (e.key === 'Enter') addTicker(); });

// ── Price ──────────────────────────────────────────────────────────────────
async function fetchOneTicker(sym) {
  const methods = [
    async () => {
      const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FINNHUB_KEY}`, { signal: AbortSignal.timeout(5000) });
      const d = await r.json(); if (!d.c || d.c === 0) throw 0;
      return { price: d.c, chg: d.d, pct: d.dp };
    },
    async () => {
      const u = encodeURIComponent(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${FINNHUB_KEY}`);
      const r = await fetch(`https://api.allorigins.win/get?url=${u}`, { signal: AbortSignal.timeout(8000) });
      const d = JSON.parse((await r.json()).contents); if (!d.c || d.c === 0) throw 0;
      return { price: d.c, chg: d.d, pct: d.dp };
    },
    async () => {
      const u = encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1m&range=1d`);
      const r = await fetch(`https://api.allorigins.win/get?url=${u}`, { signal: AbortSignal.timeout(8000) });
      const d = JSON.parse((await r.json()).contents);
      const m = d.chart?.result?.[0]?.meta; if (!m?.regularMarketPrice) throw 0;
      const prev = m.previousClose || m.chartPreviousClose, chg = m.regularMarketPrice - prev;
      return { price: m.regularMarketPrice, chg, pct: prev > 0 ? chg / prev * 100 : 0 };
    }
  ];
  for (const fn of methods) {
    try { const res = await fn(); const t = tickers.find(x => x.symbol === sym); if (t) { t.price = res.price; t.chg = res.chg; t.pct = res.pct; } return; } catch(e) {}
  }
}
async function fetchAllPrices() {
  for (const t of tickers) await fetchOneTicker(t.symbol);
  renderTabs(); updatePriceDisplay(); recalc();
  clearTimeout(refreshTimer); refreshTimer = setTimeout(fetchAllPrices, 60000);
}
async function fetchPrice() {
  document.getElementById('refreshIcon').innerHTML = '<span class="spin">⟳</span>';
  document.getElementById('priceStatus').textContent = '获取中...';
  await fetchOneTicker(active);
  renderTabs(); updatePriceDisplay(); recalc();
  document.getElementById('refreshIcon').innerHTML = '⟳';
  clearTimeout(refreshTimer); refreshTimer = setTimeout(fetchAllPrices, 60000);
}
function updatePriceDisplay() {
  const t = tickers.find(x => x.symbol === active);
  const pe = document.getElementById('livePrice'), ce = document.getElementById('priceChg');
  const de = document.getElementById('liveDot'), se = document.getElementById('priceStatus');
  if (!t?.price) { pe.textContent = '---.--'; ce.textContent = '-- %'; de.className = 'dot'; se.textContent = '未加载'; return; }
  pe.textContent = '$' + t.price.toFixed(2); pe.className = 'live-price' + (t.chg < 0 ? ' down' : '');
  ce.textContent = (t.pct >= 0 ? '+' : '') + t.pct.toFixed(2) + '%'; ce.className = 'price-chg' + (t.pct < 0 ? ' neg' : '');
  de.className = 'dot live'; se.textContent = '✓ 已更新 ' + new Date().toLocaleTimeString('zh-CN');
}

// ── Form type toggle ───────────────────────────────────────────────────────
function onTypeChange() {
  const type = document.getElementById('txType').value;
  const isDiv = type === 'div';
  // Buy/sell fields
  document.getElementById('fShares').classList.toggle('hidden', isDiv);
  document.getElementById('fPrice').classList.toggle('hidden', isDiv);
  document.getElementById('fFee').classList.toggle('hidden', isDiv);
  // Dividend fields
  document.getElementById('fDivTotal').classList.toggle('hidden', !isDiv);
  document.getElementById('fDivPer').classList.toggle('hidden', !isDiv);
  // Button style
  const btn = document.getElementById('btnConfirm');
  btn.className = 'btn-confirm' + (type === 'sell' ? ' sell' : type === 'div' ? ' div' : '');
  document.getElementById('feeHint').textContent = '';
}

function calcDivTotal() {
  // Auto-fill total from per-share × current shares
  const perShare = parseFloat(document.getElementById('txDivPer').value) || 0;
  const r = calcPosition();
  if (perShare > 0 && r && r.totalShares > 0) {
    const total = perShare * r.totalShares;
    document.getElementById('txDivTotal').value = total.toFixed(2);
    document.getElementById('feeHint').textContent = `${r.totalShares.toFixed(0)} 股 × $${perShare} = 总派息 $${total.toFixed(2)}`;
  }
}

function updateHint() {
  const type = document.getElementById('txType').value;
  const el = document.getElementById('feeHint');
  if (type === 'div') {
    const total = parseFloat(document.getElementById('txDivTotal').value) || 0;
    const r = calcPosition();
    if (total > 0 && r && r.totalShares > 0) {
      const costDrop = total / r.totalShares;
      el.textContent = `派息 $${total.toFixed(2)} → 平均成本降低 $${costDrop.toFixed(4)} / 股`;
    } else el.textContent = '';
  } else {
    const shares = parseFloat(document.getElementById('txShares').value) || 0;
    const price  = parseFloat(document.getElementById('txPrice').value) || 0;
    const fee    = parseFloat(document.getElementById('txFee').value) || 0;
    if (shares > 0 && price > 0) {
      el.textContent = `交易金额 $${(shares*price).toFixed(2)} + 手续费 $${fee.toFixed(2)} = 合计 $${(shares*price+fee).toFixed(2)}`;
    } else el.textContent = '';
  }
}

// ── Calculation ────────────────────────────────────────────────────────────
function calcPosition() {
  const p = positions[active]; if (!p) return null;
  let totalShares = 0, totalCost = 0, totalFees = 0, tProfit = 0, totalDividend = 0, origTotalCost = 0;

  for (const tx of (p.transactions || [])) {
    const fee = tx.fee || 0;
    if (tx.type === 'buy') {
      totalCost += tx.shares * tx.price + fee;
      totalShares += tx.shares;
      totalFees += fee;
      origTotalCost += tx.shares * tx.price + fee;
    } else if (tx.type === 'sell') {
      if (totalShares <= 0) continue;
      const avg = totalCost / totalShares;
      const profit = tx.shares * tx.price - fee - avg * tx.shares;
      tProfit += profit;
      totalCost -= avg * tx.shares;
      totalShares -= tx.shares;
      totalFees += fee;
    } else if (tx.type === 'div') {
      // Dividend reduces total cost directly
      totalCost -= tx.amount;
      totalDividend += tx.amount;
    }
  }

  const avgCost = totalShares > 0 ? totalCost / totalShares : 0;
  return { totalShares, totalCost, avgCost, totalFees, tProfit, totalDividend, origTotalCost };
}

function recalc() {
  const r = calcPosition();
  const t = tickers.find(x => x.symbol === active);
  const lp = t?.price;

  if (!r || r.totalShares <= 0) {
    ['sAvg','sShares','sTotalCost','sMarket','sPnl','sFees'].forEach(id => document.getElementById(id).textContent = '--');
    document.getElementById('sTProfit').textContent = '$0.00';
    document.getElementById('sDividend').textContent = '$0.00';
    document.getElementById('progFill').style.width = '0%';
    document.getElementById('progPct').textContent = '0%';
    document.getElementById('ctzRow').style.display = 'none';
    document.getElementById('alertBox').textContent = '';
    renderTxList(); return;
  }

  document.getElementById('sAvg').textContent = '$' + r.avgCost.toFixed(3);
  document.getElementById('sShares').textContent = r.totalShares.toFixed(0);
  document.getElementById('sTotalCost').textContent = '$' + r.totalCost.toFixed(2);
  document.getElementById('sFees').textContent = '-$' + r.totalFees.toFixed(2);
  document.getElementById('sTProfit').textContent = (r.tProfit >= 0 ? '+$' : '-$') + Math.abs(r.tProfit).toFixed(2);
  document.getElementById('sDividend').textContent = '+$' + r.totalDividend.toFixed(2);

  if (lp) {
    const mkt = lp * r.totalShares;
    const pnl = mkt - r.totalCost;
    const pnlPct = r.totalCost > 0 ? pnl / r.totalCost * 100 : 0;
    document.getElementById('sMarket').textContent = '$' + mkt.toFixed(2);
    const pnlEl = document.getElementById('sPnl');
    pnlEl.textContent = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2) + ' (' + (pnl >= 0 ? '+' : '') + pnlPct.toFixed(2) + '%)';
    pnlEl.className = 'stat-val ' + (pnl >= 0 ? 'g' : 'r');
    const alertEl = document.getElementById('alertBox');
    if (lp >= r.avgCost) {
      alertEl.className = 'alert ok';
      alertEl.textContent = '✓ 当前价高于成本价 $' + (lp - r.avgCost).toFixed(3) + ' / 股';
    } else {
      alertEl.className = 'alert bad';
      alertEl.textContent = '↓ 当前价低于成本价 $' + (r.avgCost - lp).toFixed(3) + ' / 股，继续做T摊低';
    }
  } else {
    document.getElementById('sMarket').textContent = '--';
    document.getElementById('sPnl').textContent = '--';
    document.getElementById('alertBox').textContent = '';
  }

  // Progress = (tProfit + dividend) / origTotalCost
  const totalReduced = r.tProfit + r.totalDividend;
  const prog = r.origTotalCost > 0 ? Math.max(0, Math.min(100, totalReduced / r.origTotalCost * 100)) : 0;
  document.getElementById('progFill').style.width = prog + '%';
  document.getElementById('progPct').textContent = prog.toFixed(1) + '% 已降低';

  // 离零成本
  const remainCost = r.avgCost * r.totalShares;
  const ctzRow = document.getElementById('ctzRow');
  const ctzVal = document.getElementById('ctzVal');
  ctzRow.style.display = 'flex';
  if (remainCost <= 0.01) {
    ctzVal.textContent = '🎉 已达成零成本！'; ctzVal.className = 'ctz-val zero';
  } else {
    ctzVal.textContent = '-$' + remainCost.toFixed(2); ctzVal.className = 'ctz-val';
  }

  renderTxList();
  save();
}

// ── Add Transaction ────────────────────────────────────────────────────────
function addTx() {
  const type = document.getElementById('txType').value;

  if (type === 'div') {
    const amount = parseFloat(document.getElementById('txDivTotal').value);
    if (!amount || amount <= 0) return alert('请填入派息金额');
    positions[active].transactions.push({ type: 'div', amount });
    document.getElementById('txDivTotal').value = '';
    document.getElementById('txDivPer').value = '';
  } else {
    const shares = parseFloat(document.getElementById('txShares').value);
    const price  = parseFloat(document.getElementById('txPrice').value);
    const fee    = parseFloat(document.getElementById('txFee').value) || 0;
    if (!shares || !price || shares <= 0 || price <= 0) return alert('请填入有效的股数和价格');
    const r = calcPosition();
    if (type === 'sell' && shares > (r ? r.totalShares : 0)) return alert(`卖出股数不能超过持有的 ${r ? r.totalShares.toFixed(0) : 0} 股`);
    positions[active].transactions.push({ type, shares, price, fee });
    document.getElementById('txShares').value = '';
    document.getElementById('txPrice').value = '';
  }

  document.getElementById('feeHint').textContent = '';
  recalc();
}

// ── Render List ────────────────────────────────────────────────────────────
function renderTxList() {
  const p = positions[active];
  const list = document.getElementById('txList');
  if (!p?.transactions?.length) { list.innerHTML = '<div class="empty">还没有交易记录</div>'; return; }

  let runShares = 0, runCost = 0;
  list.innerHTML = p.transactions.map((tx, i) => {
    let eff = '', info = '', feeStr = '';

    if (tx.type === 'buy') {
      const prevAvg = runShares > 0 ? runCost / runShares : null;
      runCost += tx.shares * tx.price + (tx.fee || 0); runShares += tx.shares;
      const newAvg = runCost / runShares;
      info = `<strong>${tx.shares}股</strong> @ $${tx.price.toFixed(3)}`;
      feeStr = `<span class="tx-fee-lbl">费$${(tx.fee||0).toFixed(2)}</span>`;
      if (prevAvg !== null) {
        const d = newAvg - prevAvg;
        eff = `<span class="tx-eff ${d > 0 ? 'r' : 'g'}">${d > 0 ? '成本↑' : '成本↓'} $${Math.abs(d).toFixed(3)}</span>`;
      } else {
        eff = `<span class="tx-eff" style="color:var(--muted)">首笔买入</span>`;
      }
    } else if (tx.type === 'sell') {
      const avg = runShares > 0 ? runCost / runShares : 0;
      const profit = tx.shares * tx.price - (tx.fee||0) - avg * tx.shares;
      runCost -= avg * tx.shares; runShares -= tx.shares;
      info = `<strong>${tx.shares}股</strong> @ $${tx.price.toFixed(3)}`;
      feeStr = `<span class="tx-fee-lbl">费$${(tx.fee||0).toFixed(2)}</span>`;
      eff = `<span class="tx-eff ${profit >= 0 ? 'g' : 'r'}">${profit >= 0 ? '做T +$' : '做T -$'}${Math.abs(profit).toFixed(2)}</span>`;
    } else if (tx.type === 'div') {
      const costDrop = runShares > 0 ? tx.amount / runShares : 0;
      runCost -= tx.amount;
      info = `<strong>派息收入</strong>`;
      feeStr = ``;
      eff = `<span class="tx-eff p">成本↓ $${costDrop.toFixed(4)}/股 · 共$${tx.amount.toFixed(2)}</span>`;
    }

    return `<div class="tx-item">
      <span class="badge ${tx.type}">${tx.type === 'buy' ? '买入' : tx.type === 'sell' ? '卖出' : '派息'}</span>
      <span class="tx-info">${info}</span>
      ${feeStr}
      ${eff}
      <button class="tx-del" onclick="delTx(${i})">✕</button>
    </div>`;
  }).join('');
}

function delTx(i) { positions[active].transactions.splice(i, 1); recalc(); }
function clearTx() { if (!confirm('清空所有记录？')) return; positions[active].transactions = []; recalc(); }

// ── Init ───────────────────────────────────────────────────────────────────
load(); renderTabs(); recalc(); fetchAllPrices();
</script>
